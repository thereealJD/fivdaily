<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AWL Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,500;0,600;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #f6f5f2;
      --sf: #fff;
      --tx: #1d1d1b;
      --mu: #76746e;
      --bd: #dedbd3;
      --ac: #1d1d1b;
      --ok: #2e7d4f;
      --er: #b3382c;
      --hl: #fde68a;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #161615;
        --sf: #1f1f1d;
        --tx: #ecebe6;
        --mu: #98958d;
        --bd: #33322e;
        --ac: #ecebe6;
        --ok: #6cc48f;
        --er: #ef7d70;
        --hl: #5c4a10;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #161615;
      --sf: #1f1f1d;
      --tx: #ecebe6;
      --mu: #98958d;
      --bd: #33322e;
      --ac: #ecebe6;
      --ok: #6cc48f;
      --er: #ef7d70;
      --hl: #5c4a10;
      color-scheme: dark;
    }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
    }
    header {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--bd);
      display: grid;
      grid-template-columns: 1fr minmax(0, 520px) 1fr;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      z-index: 30;
      background: var(--bg);
    }
    .st {
      position: relative;
      justify-self: end;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #sp {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      width: 300px;
      max-width: calc(100vw - 32px);
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 14px;
      display: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .15);
    }
    #sp label { display: block; font-weight: 600; margin-bottom: 6px; }
    #sp input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--bd);
      border-radius: 8px;
      background: var(--bg);
      color: var(--tx);
      font: inherit;
      outline: none;
    }
    #sp input:focus { border-color: var(--ac); }
    #sp .r { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
    #sp .btn { padding: 8px 16px; }
    #ss { font-size: 13px; color: var(--ok); }
    .sw { position: relative; }
    #q {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--bd);
      border-radius: 10px;
      background: var(--sf);
      color: var(--tx);
      font: inherit;
      outline: none;
    }
    #q:focus { border-color: var(--ac); }
    #dd {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 10px;
      overflow: hidden;
      display: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .15);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      cursor: pointer;
    }
    .row:hover, .row.on { background: var(--bg); }
    .row small { color: var(--mu); margin-left: 8px; }
    .ib {
      background: none;
      border: 0;
      color: var(--mu);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
    }
    .ib:hover { color: var(--tx); }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }
    body {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    }
    header { flex-shrink: 0; }
    main {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      width: 100%;
    }
    main.pv {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-width: none;
      padding: 16px;
    }
    .pv .pc { flex: 1; min-height: 0; margin-top: 0; align-items: stretch; }
    .pv .dc { position: static; max-height: none; }
    .bk { cursor: pointer; margin-bottom: 12px; flex-shrink: 0; width: max-content; }
    .bk:hover { color: var(--tx); }
    @media (max-width: 820px) {
      main.pv { overflow-y: auto; }
      .pv .pc { flex: none; }
      .pv .wc { height: 80vh; }
      .pv .dc { height: auto; }
    }
    :root { --fl: #7c624b; --pn: #a39c91; --lk: #4a624d; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --fl: #d3b48f; --pn: #8d897f; --lk: #8fc79a; }
    }
    :root[data-theme="dark"] { --fl: #d3b48f; --pn: #8d897f; --lk: #8fc79a; }
    main.pv {
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: calc(100dvh - var(--hh, 69px) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    }
    .pc {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      gap: 24px;
      flex: 1;
      min-height: 0;
      margin-top: 12px;
    }
    #md {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 60;
      padding: 16px;
    }
    .mdl {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 22px 24px;
      width: 520px;
      max-width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .3);
    }
    .wc { order: 1; display: flex; flex-direction: column; min-height: 0; }
    .wc > *:not(ol) { flex: none; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .mu { color: var(--mu); }
    .box { display: flex; gap: 8px; margin: 18px 0 6px; }
    #in {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid var(--bd);
      border-radius: 10px;
      background: var(--sf);
      color: var(--tx);
      font: inherit;
      outline: none;
    }
    #in:focus { border-color: var(--ac); }
    .wc ol {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0;
      margin: 14px 0 0;
      list-style: none;
    }
    li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 0;
      border-bottom: 1px solid var(--bd);
    }
    li b { color: var(--mu); min-width: 26px; font-weight: 500; }
    li p { margin: 0; flex: 1; }
    mark {
      background: var(--hl);
      color: inherit;
      border-radius: 3px;
      padding: 0 2px;
    }
    .dc {
      display: flex;
      flex-direction: column;
      order: 2;
      min-height: 0;
      overflow-y: auto;
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 22px 24px;
      box-shadow: 0 4px 12px rgba(45, 40, 36, .04);
    }
    .dc > * { flex: none; }
    .nodef { margin: auto; color: var(--mu); font-style: italic; }
    .dt { font: 600 28px/1.2 'Crimson Pro', Georgia, serif; margin-bottom: 10px; }
    .dbody { font-size: 14px; line-height: 1.65; color: color-mix(in srgb, var(--tx) 82%, var(--bg)); }
    .ent + .ent { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--bd); }
    .eh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
    .fl { font: italic 600 16px 'Crimson Pro', Georgia, serif; color: var(--fl); }
    .pron { color: var(--pn); font-size: 13px; }
    .sb { margin: 0 0 6px; }
    .sb.sub { margin-left: 2em; }
    .sn { font-weight: 600; color: var(--tx); margin-right: 5px; }
    .sb.sub .sn { font-weight: 500; color: var(--mu); }
    .ex { color: var(--mu); font-style: italic; font-size: 13px; margin: 2px 0 0 1em; }
    .mw-link {
      color: var(--lk);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid color-mix(in srgb, var(--lk) 35%, transparent);
    }
    .mw-link:hover { border-bottom-color: var(--lk); }
    .mvl {
      display: inline-block;
      margin-top: 14px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--mu);
      text-decoration: none;
    }
    .mvl:hover { color: var(--tx); }
    .wt { font-size: 16px; font-weight: 600; }
    @media (max-width: 820px) {
      main.pv { display: block; height: auto; overflow: visible; }
      .pc { display: flex; flex-direction: column; }
      .wc ol { overflow: visible; }
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }
    .card {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
    }
    .card:hover { border-color: var(--ac); }
    .bar { height: 4px; background: var(--bd); border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--ok); }
    .card span { color: var(--mu); font-size: 12px; }
    .btn {
      padding: 0 18px;
      border: 0;
      border-radius: 10px;
      background: var(--ac);
      color: var(--bg);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .btn.g { background: none; color: var(--mu); border: 1px solid var(--bd); }
    #msg { min-height: 22px; color: var(--er); font-size: 14px; }
    .pg { height: 6px; background: var(--bd); border-radius: 3px; overflow: hidden; margin-top: 10px; }
    .pg i { display: block; height: 100%; background: var(--ok); transition: width .2s; }

    /* table view */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--bd);
      border-radius: 12px;
      background: var(--sf);
      box-shadow: 0 4px 12px rgba(45, 40, 36, .04);
      margin-top: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 500px;
    }
    th {
      text-align: left;
      padding: 14px 18px;
      background: var(--bg);
      color: var(--mu);
      font-weight: 600;
      border-bottom: 1px solid var(--bd);
      white-space: nowrap;
    }
    td {
      padding: 12px 18px;
      border-bottom: 1px solid var(--bd);
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: color-mix(in srgb, var(--bg) 60%, transparent); }
    .headword {
      font-weight: 600;
      color: var(--tx);
      cursor: pointer;
    }
    .headword:hover { text-decoration: underline; }
    .form-link {
      color: var(--lk);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid color-mix(in srgb, var(--lk) 35%, transparent);
      cursor: pointer;
    }
    .form-link:hover { border-bottom-color: var(--lk); }
    .form-sep { color: var(--mu); margin: 0 2px; }
    @media (max-width: 640px) {
      header { grid-template-columns: 1fr auto; }
      header > div:first-child { display: none; }
      .st { gap: 4px; }
    }
  </style>
</head>
<body>
<header>
  <div></div>
  <div class="sw">
    <input id="q" placeholder="Search any word…" autocomplete="off" spellcheck="false">
    <div id="dd"></div>
  </div>
  <div class="st">
    <button class="ib" id="toggleView" title="Toggle table view">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
      </svg>
    </button>
    <button class="ib" id="sb" title="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
      </svg>
    </button>
    <div id="sp">
      <label for="mw">Merriam-Webster API key</label>
      <input id="mw" type="password" placeholder="Paste key here" autocomplete="off" spellcheck="false">
      <div class="r">
        <button class="btn" id="mws">Save</button>
        <button class="btn g" id="mwc">Clear</button>
        <span id="ss"></span>
      </div>
    </div>
  </div>
</header>
<main id="app"></main>
<div id="md"><div class="mdl" id="mdc"></div></div>
<script>
  const N = 40;
  const RAW_URL = 'AWL.txt';   // relative path
  const heads = [];
  const idx = [];
  let cur = null;
  let store = {};
  try { store = JSON.parse(localStorage.getItem('awl:s') || '{}') || {}; } catch (e) { store = {}; }
  const save = () => { try { localStorage.setItem('awl:s', JSON.stringify(store)); } catch (e) {} };
  const cnt = w => (store[w] || []).length;

  // --- helpers ---
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const html = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // --- fuzzy search ---
  function lev(a, b) {
    const d = [];
    for (let i = 0; i <= a.length; i++) d[i] = [i];
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++)
      for (let j = 1; j <= b.length; j++)
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }
  function score(q, w) {
    w = w.toLowerCase();
    if (w === q) return 100;
    if (w.startsWith(q)) return 90 - (w.length - q.length) * 0.1;
    const i = w.indexOf(q);
    if (i >= 0) return 70 - i;
    let p = 0;
    for (const c of w) if (c === q[p]) p++;
    if (p === q.length && q.length > 2) return 45;
    const d = Math.min(lev(q, w), lev(q, w.slice(0, q.length)));
    const t = q.length <= 4 ? 1 : 2;
    return d <= t ? 40 - d * 8 : -1;
  }
  function search(q) {
    q = q.trim().toLowerCase();
    if (!q) return [];
    return idx
      .map(e => ({ e, s: score(q, e.w) }))
      .filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s || a.e.w.length - b.e.w.length)
      .slice(0, 12)
      .map(x => x.e);
  }

  // --- similarity (for practice) ---
  const STOP = new Set('a an the and or but of to in on at for with by from is are was were be been it its this that these those as he she they we you i his her their our my your not no so if then than do does did has have had will would can could should may might there which who whom what when where how'.split(' '));
  const toks = s => s.toLowerCase().replace(/[^a-z\s'-]/g, ' ').split(/\s+/).filter(Boolean);
  const keys = s => new Set(toks(s).filter(t => !STOP.has(t)));
  function jac(a, b) { let i = 0; a.forEach(x => b.has(x) && i++); const u = a.size + b.size - i; return u ? i / u : 0; }
  const bigr = s => { const t = toks(s), o = new Set; for (let i = 0; i < t.length - 1; i++) o.add(t[i] + ' ' + t[i + 1]); return o; };
  function similarTo(s) {
    const k = keys(s), b = bigr(s);
    for (const w in store) for (const o of store[w]) {
      if (o.toLowerCase().trim() === s.toLowerCase().trim()) return o;
      if (jac(k, keys(o)) >= 0.5 || jac(b, bigr(o)) >= 0.4) return o;
    }
    return null;
  }

  // --- Merriam-Webster ---
  const MWW = 'https://www.merriam-webster.com/dictionary/';
  const lk = (s, t) => `<a href="${MWW}${encodeURIComponent(s)}" target="_blank" rel="noopener" class="mw-link">${t}</a>`;
  const nz = s => s.replace(/:\d+$/, '');
  function cmw(t) {
    return (t || '').replace(/\{bc\}/g, ': ')
      .replace(/\{(?:sx|mw_t_sx)\|([^|}]+)[^}]*\}/g, (m, a) => lk(nz(a), nz(a)))
      .replace(/\{(?:d_link|i_link|et_link|mat)\|([^|}]+)\|?([^|}]*)[^}]*\}/g, (m, a, b) => lk(nz(b || a), a))
      .replace(/\{a_link\|([^|}]+)\}/g, (m, a) => lk(a, a))
      .replace(/\{xt\|([^|}]+)[^}]*\}/g, '$1')
      .replace(/\{(?:it|wi)\}/g, '<em>').replace(/\{\/(?:it|wi)\}/g, '</em>')
      .replace(/\{b\}/g, '<b>').replace(/\{\/b\}/g, '</b>')
      .replace(/\{inf\}/g, '<sub>').replace(/\{\/inf\}/g, '</sub>').replace(/\{sup\}/g, '<sup>').replace(/\{\/sup\}/g, '</sup>')
      .replace(/\{phrase\}/g, '<b><em>').replace(/\{\/phrase\}/g, '</em></b>')
      .replace(/\{ldquo\}/g, '“').replace(/\{rdquo\}/g, '”')
      .replace(/\{[^}]+\}/g, '').replace(/\s+/g, ' ').trim();
  }
  function mwS(it, o) {
    if (!Array.isArray(it)) return;
    const [t, x] = it;
    if (t === 'sense') o.push(x);
    else if (t === 'bs' && x && x.sense) o.push(x.sense);
    else if (t === 'pseq' && Array.isArray(x)) x.forEach(y => mwS(y, o));
  }
  function dtH(dt) {
    const tx = []; let ex = '';
    (dt || []).forEach(p => {
      if (p[0] === 'text') tx.push(cmw(p[1]));
      else if (p[0] === 'uns') (p[1] || []).forEach(u => u.forEach(q => q[0] === 'text' && tx.push(cmw(q[1]))));
      else if (p[0] === 'vis' && !ex && p[1] && p[1][0]) ex = cmw(p[1][0].t);
    });
    return { t: tx.join(' ').trim(), ex };
  }
  function mwHTML(d, w) {
    const lw = w.toLowerCase();
    let es = d.filter(e => e && typeof e === 'object' && e.def);
    const m = es.filter(e => ((e.meta || {}).stems || []).some(s => s.toLowerCase() === lw));
    if (m.length) es = m;
    return es.map(e => {
      let b = '';
      (e.def || []).forEach(df => (df.sseq || []).forEach(sq => {
        const ss = []; sq.forEach(it => mwS(it, ss));
        ss.forEach(s => {
          const sn = String(s.sn || '').trim(), x = dtH(s.dt);
          if (x.t || sn) b += `<div class="sb${/^[a-z(]/.test(sn) ? ' sub' : ''}"><span class="sn">${sn}</span>${x.t}${x.ex ? `<div class="ex">${x.ex}</div>` : ''}</div>`;
          if (s.sdsense) { const y = dtH(s.sdsense.dt); b += `<div class="sb sub"><span class="sn">${s.sdsense.sd || ''}</span>${y.t}</div>`; }
        });
      }));
      const pr = ((e.hwi || {}).prs || [])[0];
      return b ? `<div class="ent"><div class="eh"><span class="fl">${e.fl || ''}</span>${pr && pr.mw ? `<span class="pron">/${pr.mw}/</span>` : ''}</div>${b}</div>` : '';
    }).join('');
  }
  const dcache = (() => { try { return JSON.parse(localStorage.getItem('awl:defs') || '{}') || {}; } catch (e) { return {}; } })();
  async function getDef(w) {
    const k = getKey();
    if (!k) return '';
    let h = dcache[w];
    if (h === undefined) {
      try {
        const r = await fetch('https://www.dictionaryapi.com/api/v3/references/collegiate/json/' + encodeURIComponent(w) + '?key=' + encodeURIComponent(k));
        const d = r.ok ? await r.json() : null;
        h = Array.isArray(d) && d.length && typeof d[0] === 'object' ? mwHTML(d, w) : '';
        if (h) { dcache[w] = h; try { localStorage.setItem('awl:defs', JSON.stringify(dcache)); } catch (e) {} }
      } catch (e) { h = ''; }
    }
    return h || '';
  }
  const card = (w, h) => `<div class="dt">${html(w)}</div>${h ? `<div class="dbody">${h}</div>` : ''}<a class="mvl" href="${MWW}${encodeURIComponent(w)}" target="_blank" rel="noopener">View on Merriam-Webster ↗</a>`;
  async function loadDef(w) {
    const h = await getDef(w), box = $('dc');
    if (cur !== w || !box) return;
    box.innerHTML = h ? card(w, h) : '<div class="nodef">No definition</div>';
  }

  // --- link modal ---
  const md = $('md'), mdc = $('mdc'); let mdw = '';
  const closeMd = () => { md.style.display = 'none'; mdw = ''; };
  md.onclick = e => { if (e.target === md) closeMd(); };
  addEventListener('keydown', e => { if (e.key === 'Escape') closeMd(); });
  document.addEventListener('click', async e => {
    const a = e.target.closest('.mw-link');
    if (!a) return;
    e.preventDefault();
    const w = decodeURIComponent(a.getAttribute('href').slice(MWW.length)), f = idx.find(x => x.w.toLowerCase() === w.toLowerCase());
    if (f) { closeMd(); practice(f.w); return; }
    mdw = w;
    mdc.innerHTML = `<div class="dt">${html(w)}</div><div class="mu">Not in your word list</div>`;
    md.style.display = 'flex';
    const h = await getDef(w);
    if (mdw !== w) return;
    mdc.innerHTML = `<div class="mu" style="margin-bottom:6px">Not in your word list</div>` + card(w, h);
  });

  // --- views ---
  let tableView = false;
  function home() {
    cur = null;
    const app = $('app');
    app.className = '';
    if (tableView) {
      // table view
      app.innerHTML = `
        <h1>Academic Word List</h1>
        <p class="mu">${heads.length} headwords · Click a headword to practice</p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Head word</th><th>Similar word forms</th></tr></thead>
            <tbody>
              ${heads.map(w => {
                const forms = idx.filter(x => x.h === w && x.w !== w).map(x => x.w);
                const formLinks = forms.map(f => `<span class="form-link" data-word="${html(f)}">${html(f)}</span>`).join('<span class="form-sep">, </span>');
                return `<tr><td class="headword" data-word="${html(w)}">${html(w)}</td><td>${formLinks || '<span class="mu">—</span>'}</td></tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`;
      // attach click handlers
      document.querySelectorAll('.headword[data-word]').forEach(el => {
        el.onclick = () => practice(el.dataset.word);
      });
      document.querySelectorAll('.form-link[data-word]').forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          const w = el.dataset.word;
          const found = idx.find(x => x.w.toLowerCase() === w.toLowerCase());
          if (found) practice(found.w);
          else practice(w);
        };
      });
    } else {
      // card view
      app.innerHTML = `<h1>Practice</h1><p class="mu">${heads.length} headwords · ${N} sentences each · ${heads.reduce((a, w) => a + cnt(w), 0)} written</p>
        <div class="grid">${heads.map(w => `<div class="card" data-w="${w}"><b>${w}</b><br><span>${cnt(w)}/${N}</span><div class="bar"><i style="width:${cnt(w) / N * 100}%"></i></div></div>`).join('')}</div>`;
      document.querySelectorAll('.card').forEach(c => c.onclick = () => practice(c.dataset.w));
    }
  }

  function hl(s, w) {
    return html(s).replace(new RegExp('(^|[^A-Za-z])(' + esc(html(w)) + ')(?![A-Za-z])', 'ig'), '$1<mark>$2</mark>');
  }

  function practice(w) {
    cur = w;
    const app = $('app');
    app.className = 'pv';
    const e = idx.find(x => x.w === w), n = cnt(w);
    app.innerHTML = `
      <div class="mu bk" id="bk">← all words</div>
      <div class="pc">
        <div class="dc" id="dc"></div>
        <div class="wc">
          <h1>${html(w)}</h1>
          <div class="mu">${e && e.h !== w ? 'form of ' + e.h + ' · ' : ''}${n}/${N} sentences</div>
          <div class="pg"><i style="width:${n / N * 100}%"></i></div>
          ${n < N ? `<div class="box"><input id="in" placeholder="Sentence ${n + 1} using “${html(w)}”" autocomplete="off"><button class="btn" id="add">Add</button></div><div id="msg"></div>` : `<p style="color:var(--ok);font-weight:600;margin:18px 0">Done. ${N}/${N}.</p>`}
          <ol>${(store[w] || []).map((s, i) => `<li><b>${i + 1}</b><p>${hl(s, w)}</p><button class="ib" data-d="${i}" title="Delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button></li>`).join('')}</ol>
        </div>
      </div>`;
    $('bk').onclick = home;
    loadDef(w);
    const ol = document.querySelector('.wc ol');
    ol.scrollTop = ol.scrollHeight;
    document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { store[w].splice(+b.dataset.d, 1); save(); practice(w); });
    const inp = $('in');
    if (inp) {
      inp.focus({ preventScroll: true });
      const go = () => {
        const s = inp.value.trim().replace(/\s+/g, ' '), m = $('msg');
        const bad = r => { m.textContent = r; };
        if (toks(s).length < 4) return bad('At least 4 words.');
        if (!new RegExp('(^|[^A-Za-z])' + esc(w) + '(?![A-Za-z])', 'i').test(s)) return bad('Sentence must contain “' + w + '” exactly.');
        const o = similarTo(s);
        if (o) return bad('Too similar to: “' + o + '”');
        (store[w] = store[w] || []).push(s);
        save();
        practice(w);
      };
      $('add').onclick = go;
      inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    }
  }

  // --- search UI ---
  const q = $('q'), dd = $('dd'); let res = [], sel = 0;
  function draw() {
    res = search(q.value);
    sel = 0;
    if (!res.length) {
      dd.style.display = q.value.trim() ? 'block' : 'none';
      dd.innerHTML = q.value.trim() ? '<div class="row mu">No match.</div>' : '';
      return;
    }
    dd.style.display = 'block';
    dd.innerHTML = res.map((e, i) => `<div class="row${i ? '' : ' on'}" data-i="${i}"><span>${html(e.w)}${e.h !== e.w ? `<small>${html(e.h)}</small>` : ''}</span></div>`).join('');
    dd.querySelectorAll('.row[data-i]').forEach(r => r.onclick = () => pick(res[+r.dataset.i]));
  }
  function pick(e) {
    dd.style.display = 'none';
    q.value = '';
    practice(e.w);
  }
  q.oninput = draw;
  q.onfocus = draw;
  q.onkeydown = e => {
    const rows = dd.querySelectorAll('.row[data-i]');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length;
      rows.forEach((r, i) => r.classList.toggle('on', i === sel));
    } else if (e.key === 'Enter' && res[sel]) pick(res[sel]);
    else if (e.key === 'Escape') dd.style.display = 'none';
  };
  document.addEventListener('click', e => { if (!e.target.closest('.sw')) dd.style.display = 'none'; });

  // --- settings ---
  const sp = $('sp'), mw = $('mw'), ss = $('ss');
  const getKey = () => { try { return localStorage.getItem('awl:mw') || ''; } catch (e) { return ''; } };
  const flash = t => { ss.textContent = t; setTimeout(() => ss.textContent = '', 1800); };
  $('sb').onclick = e => {
    e.stopPropagation();
    const o = sp.style.display === 'block';
    sp.style.display = o ? 'none' : 'block';
    if (!o) { mw.value = getKey(); mw.focus(); }
  };
  sp.onclick = e => e.stopPropagation();
  document.addEventListener('click', () => sp.style.display = 'none');
  $('mws').onclick = () => { try { localStorage.setItem('awl:mw', mw.value.trim()); flash('Saved'); } catch (e) { flash('Failed'); } };
  $('mwc').onclick = () => { try { localStorage.removeItem('awl:mw'); } catch (e) {} mw.value = ''; flash('Cleared'); };
  mw.onkeydown = e => { if (e.key === 'Enter') $('mws').click(); };

  // --- toggle table view ---
  $('toggleView').onclick = (e) => {
    e.stopPropagation();
    tableView = !tableView;
    if (cur) { cur = null; home(); } else home();
  };

  const hh = () => document.documentElement.style.setProperty('--hh', document.querySelector('header').offsetHeight + 'px');
  hh();
  addEventListener('resize', hh);

  // --- load AWL.txt and initialise ---
  async function loadData() {
    try {
      const resp = await fetch(RAW_URL);
      if (!resp.ok) throw new Error('fetch failed');
      const text = await resp.text();
      text.split('\n').forEach(l => {
        const m = l.match(/^(.+?)\{(.*)\}$/);
        if (!m) return;
        const head = m[1].trim();
        heads.push(head);
        idx.push({ w: head, h: head });
        m[2].split(',').forEach(f => {
          const form = f.trim();
          if (form) idx.push({ w: form, h: head });
        });
      });
      // ensure headwords also present (already added)
      home();
    } catch (e) {
      $('app').innerHTML = `<p class="mu">Error loading AWL.txt. Make sure the file is in the same folder.</p>`;
    }
  }
  loadData();
</script>
</body>
</html>
